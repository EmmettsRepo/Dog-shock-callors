; PlatformIO configuration for ESP32 Collar Bridge
;
; Hardware setup:
;   ESP32 dev board (any variant with BLE support)
;   433MHz transmitter module (MX-FS-03V or similar)
;     DATA -> GPIO 4
;     VCC  -> 3.3V
;     GND  -> GND
;   Optional: 17cm wire antenna on transmitter for better range

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ESP32 BLE Arduino
